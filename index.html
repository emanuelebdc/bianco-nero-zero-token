<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111111"><meta name="description" content="Converti immagini in bianco e nero, sul tuo computer e senza costi."><title>Bianco / Nero — Emanuele BDC</title><script>if(location.protocol!=='file:'){const l=document.createElement('link');l.rel='manifest';l.href='./manifest.webmanifest';document.head.append(l)}</script><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:22px}main{max-width:1100px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid;padding-bottom:24px}.brand{font-weight:900;font-size:clamp(32px,6vw,68px);letter-spacing:-.06em}button,.button{font:inherit;font-weight:700;border:2px solid #111;background:#111;color:white;border-radius:14px;padding:18px 28px;cursor:pointer;min-height:64px}button:disabled{opacity:.5;cursor:wait}button.secondary{color:#111;background:transparent}button:focus-visible,a:focus-visible{outline:4px solid #2155e8;outline-offset:5px}h1{font-size:clamp(38px,7vw,76px);line-height:1.04;letter-spacing:-.05em;margin:36px 0 20px}p{line-height:1.5}.drop{border:3px dashed #777;border-radius:24px;background:white;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:22px}.drop.over{background:#e8e8e8;border-color:#111}.drop svg{width:70px;height:70px}.drop strong{font-size:clamp(26px,4vw,42px)}.hint{font-size:20px;color:#444;margin:0}.actions{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}.actions button{flex:1}canvas{display:block;max-width:100%;max-height:55vh;object-fit:contain;margin:auto;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0 / 24px 24px;border-radius:12px}.preview{padding:16px;background:white;border:2px solid #111;border-radius:20px}footer{margin-top:36px;border-top:1px solid #aaa;padding:22px 0;line-height:1.6;font-size:20px;color:#444}#status{min-height:32px;font-weight:700}#status.error{color:#a20d0d}[hidden]{display:none!important}@media(max-width:600px){main{padding:22px 16px}header{align-items:flex-start;flex-direction:column}.actions{flex-direction:column}.drop{min-height:310px}button{width:100%}}
</style></head><body><main><header><div class="brand">BIANCO / NERO</div><button id="install" class="secondary" hidden>Installa app</button></header><section id="upload"><h1>Il colore cambia.<br>La tua foto resta.</h1><p>Trascina un’immagine. Il bianco e nero è pronto in un attimo.</p><div class="drop" id="drop"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true"><path d="M32 42V8m-14 14L32 8l14 14M10 40v14h44V40"/></svg><strong>Trascina qui la tua immagine</strong><button id="choose">Scegli immagine</button><p class="hint">JPG, PNG, WebP · fino a 30 MB e 24 megapixel</p></div><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></section><section id="result" hidden><h1 id="resultTitle" tabindex="-1">Il tuo bianco e nero.</h1><div class="preview"><canvas id="canvas" aria-label="Anteprima dell’immagine convertita in scala di grigi"></canvas></div><p class="hint" id="details"></p><div class="actions"><button id="png">↓ Scarica PNG</button><button id="jpg">↓ Scarica JPG</button><button id="again" class="secondary">Nuova immagine</button></div></section><p id="status" role="status" aria-live="polite"></p><footer>100% locale · Nessuna API · €0 per conversione<br>Made with ❤️ in Milan by Emanuele BDC</footer></main><script>
'use strict';
const $=id=>document.getElementById(id), file=$('file'), drop=$('drop'), canvas=$('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});let busy=false,base='immagine',installPrompt;
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
$('choose').onclick=()=>file.click();file.onchange=()=>{if(file.files.length)convert(file.files[0]);file.value=''};
for(const event of ['dragenter','dragover'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.add('over')});
for(const event of ['dragleave','drop'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.remove('over')});
drop.addEventListener('drop',e=>{if(e.dataTransfer.files.length!==1){status('Carica una sola immagine alla volta.',true);return}convert(e.dataTransfer.files[0])});
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
async function convert(f){if(busy)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)){status('Formato non supportato. Scegli un JPG, PNG o WebP.',true);return}if(f.size>30*1024*1024){status('Il file supera 30 MB. Scegli un’immagine più leggera.',true);return}busy=true;$('choose').disabled=true;status('Conversione in corso…');let url=URL.createObjectURL(f);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Impossibile leggere questa immagine. Prova un altro file.'));img.src=url});if(!img.naturalWidth||img.naturalWidth*img.naturalHeight>24000000||Math.max(img.naturalWidth,img.naturalHeight)>16384)throw new Error('Immagine troppo grande. Usa al massimo 24 megapixel e 16.384 pixel per lato.');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);const data=ctx.getImageData(0,0,canvas.width,canvas.height);const d=data.data;for(let i=0;i<d.length;i+=4){const gray=Math.round(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2]);d[i]=d[i+1]=d[i+2]=gray}ctx.putImageData(data,0,0);base=f.name.replace(/\.[^.]+$/,'')||'immagine';$('details').textContent=canvas.width+' × '+canvas.height+' px · PNG mantiene la trasparenza; JPG usa uno sfondo bianco.';$('upload').hidden=true;$('result').hidden=false;status('Pronta. Scegli il formato da scaricare.');$('resultTitle').focus()}catch(e){status(e.message||'Conversione non riuscita. Prova un’altra immagine.',true)}finally{URL.revokeObjectURL(url);busy=false;$('choose').disabled=false}}
function download(type){let target=canvas;if(type==='jpeg'){target=document.createElement('canvas');target.width=canvas.width;target.height=canvas.height;const c=target.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,target.width,target.height);c.drawImage(canvas,0,0)}target.toBlob(blob=>{if(!blob){status('Esportazione non riuscita. Riprova.',true);return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=base+'-bianco-nero.'+(type==='jpeg'?'jpg':'png');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status('Download avviato.')},'image/'+type,.95)}
$('png').onclick=()=>download('png');$('jpg').onclick=()=>download('jpeg');$('again').onclick=()=>{$('result').hidden=true;$('upload').hidden=false;canvas.width=canvas.height=1;status('');$('choose').focus()};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').hidden=false});$('install').onclick=async()=>{if(!installPrompt)return;await installPrompt.prompt();installPrompt=null;$('install').hidden=true};
if(location.protocol!=='file:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
